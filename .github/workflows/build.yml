name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:   # 手动触发(仅构建调试,不建 release)
    inputs:
      version:
        description: '手动构建版本号(如 1.0.20)'
        required: false
        default: '0.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "解析版本: v$V"

      - name: 校验版本一致性(仅 tag 触发)
        if: github.event_name == 'push'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          PRO_VER=$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*\([0-9.]*\).*/\1/p' BPLC_STA_Monitor.pro | head -1)
          [ -n "$PRO_VER" ] || { echo "::error::解析 .pro VERSION 失败"; exit 1; }
          if [ "$PRO_VER" != "$V" ]; then
            echo "::error::tag v$V 与 .pro VERSION=$PRO_VER 不一致,请先改版本号再打 tag"
            exit 1
          fi
          echo "版本 v$V 与仓库一致,校验通过"

      - name: 安装 Qt 6.11.3 + MinGW 13.1.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          modules: 'qtserialport'
          # Qt 6.11 起 Windows 仓库改成分编译器子目录(qt6_6113/qt6_6113_mingw/),
          # aqtinstall 3.3.0(默认)不认新布局会报 "Failed to locate XML data"。
          # 修复已合入上游(miurahr/aqtinstall#1000)但未发布,先从 master 指定提交安装,
          # 等 install-qt-action 默认 aqtinstall >= 3.4 后可删掉这行。
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          cache: true

      - name: 安装 NSIS + pandoc + Chrome
        shell: bash
        run: |
          choco install nsis -y --no-progress
          choco install pandoc -y --no-progress || choco install pandoc -y --no-progress || echo "::warning::pandoc 安装失败,md2pdf 将走 stdlib 兜底"
          # Chrome 供 md2pdf.sh 优先使用(headless 打印 PDF 比 Edge 稳定;
          # 本机 Edge 某版本 --headless --print-to-pdf 静默失败)。
          # --ignore-checksums:choco 的 googlechrome 包 sha256 常滞后于 Google
          # 更新,校验失败会中断整个安装步骤;CI 临时环境跳过校验可接受。
          # 装不上也不中断:md2pdf.sh 会回退 Edge(产物校验失败才会报错)。
          choco install googlechrome -y --no-progress --ignore-checksums || echo "::warning::Chrome 安装失败,md2pdf 将回退 Edge"
          # wkhtmltopdf:浏览器全灭时的兜底(不依赖 Chrome/Edge,确保 PDF 一定打出)
          choco install wkhtmltopdf -y --no-progress || echo "::warning::wkhtmltopdf 安装失败,仅剩浏览器链路"

      # crash 依赖产物跨版本稳定(sentry-native 锁固定 ref,补丁在 3rdparty/patches):
      # 缓存命中直接跳过 crashpad+sentry 两步编译(约省 4.5 分钟)。
      # 后续测试/打包只引用 3rdparty/install 产物,不需要 sentry-native 源码。
      - name: 缓存 crash 依赖产物
        id: crashdeps
        uses: actions/cache@v4
        with:
          path: 3rdparty/install
          key: crashdeps-win-${{ hashFiles('3rdparty/build_crash_deps.sh', '3rdparty/patches/**') }}

      - name: 构建 crashpad 依赖(MinGW)
        if: steps.crashdeps.outputs.cache-hit != 'true'
        shell: bash
        run: bash 3rdparty/build_crash_deps.sh crashpad

      - name: 构建 sentry 依赖(MinGW)
        if: steps.crashdeps.outputs.cache-hit != 'true'
        shell: bash
        run: SENTRY_TRANSPORT=none bash 3rdparty/build_crash_deps.sh sentry

      - name: crash 模块测试(crashpad + sentry 后端 Windows 实测)
        shell: bash
        run: bash src/crash/tests/run_crash_tests_win.sh

      - name: round-trip 无损验证(bin↔裸hex 往返一致)
        shell: bash
        run: |
          cd unit_test/ci/roundtrip
          qmake roundtrip.pro
          mingw32-make -j"$(nproc)"
          ./release/roundtrip.exe roundtrip_test.bin roundtrip_test.txt

      - name: NW MMe 截断边界回归
        shell: bash
        run: |
          mkdir -p unit_test/ci/nw-mme-test/build
          cd unit_test/ci/nw-mme-test/build
          qmake ../nw_mme_test.pro CONFIG+=release CONFIG-=debug
          mingw32-make -j"$(nproc)"
          ./release/nw_mme_test.exe

      - name: 构建 + 打包
        shell: bash
        run: bash scripts/package_ci.sh "${{ steps.ver.outputs.version }}"

      - name: 冒烟:offscreen 启动,检查无启动期崩溃
        shell: bash
        run: |
          cd release
          ls BPLC_STA_Monitor.exe crashpad_handler.exe
          rm -rf crashpad_db
          set +e
          timeout 20 ./BPLC_STA_Monitor.exe -platform offscreen
          code=$?
          set -e
          echo "exit=$code (124=被 timeout 正常结束,说明进程存活)"
          if [ -n "$(find crashpad_db -name '*.dmp' 2>/dev/null | head -1)" ]; then
            echo "::error::启动期产生崩溃 dump"
            find crashpad_db -name '*.dmp'
            exit 1
          fi
          echo "冒烟通过:无启动期崩溃"

      - name: 上传 Windows 安装包(仅手动触发时,供取包验证)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: BPLC_STA_Monitor_win64
          path: |
            dist/BPLC_STA_Monitor_Setup_v*.exe
            dist/BPLC_STA_Monitor_v*_win64_symbols.tar.gz

      - name: 上传 Windows 崩溃测试产物
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crashpad_windows_test
          path: |
            src/crash/tests/build_win/db_crashpad/**/*.dmp
            src/crash/tests/build_win/crash_test_crashpad.exe
            src/crash/tests/build_win/symbolize.log

      - name: 提取 changelog 作为发布说明(仅 tag 触发)
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import json
          d = json.load(open('update.json', encoding='utf-8'))
          body = d['updates']['windows']['changelog'].replace('<br/>', '\n')
          open('release_body.md', 'w', encoding='utf-8').write(body)
          PY

      - name: 建 Release + 传 asset(仅 tag 触发)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            dist/BPLC_STA_Monitor_Setup_v*.exe
            dist/BPLC_STA_Monitor_v*_win64_symbols.tar.gz

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "解析版本: v$V"

      - name: 安装 Qt 6.11.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          modules: 'qtserialport'
          cache: true

      - name: 安装构建依赖
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev zlib1g-dev

      - name: 构建 crash 依赖(sentry + crashpad)
        shell: bash
        run: bash 3rdparty/build_crash_deps.sh all

      - name: crash 模块测试(双后端 SIGSEGV 实测)
        shell: bash
        run: |
          bash src/crash/tests/run_crash_tests.sh
          bash src/crash/tests/run_failure_tests.sh

      - name: 后端切换矩阵测试(选型+预期行为)
        shell: bash
        run: bash src/crash/tests/run_backend_switch_tests.sh

      - name: 构建 + 打包
        shell: bash
        run: bash scripts/package_linux.sh "${{ steps.ver.outputs.version }}"

      - name: 真实应用崩溃可用性验证(打包产物 offscreen 启动 + SIGSEGV)
        shell: bash
        run: bash src/crash/tests/run_app_crash_test.sh

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: BPLC_STA_Monitor_linux_x86_64
          path: |
            dist/BPLC_STA_Monitor_v*_linux_x86_64.tar.gz
            dist/BPLC_STA_Monitor_v*_linux_x86_64_symbols.tar.gz

      - name: 传 asset 到 Release(仅 tag 触发)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/BPLC_STA_Monitor_v*_linux_x86_64.tar.gz
            dist/BPLC_STA_Monitor_v*_linux_x86_64_symbols.tar.gz

  # 发版清单与校验和:两个平台都把产物传进 Release 后,本 job 从 Release 下回
  # 全部 asset,用 scripts/update_json_release.py 改好 update.json 的
  # latest-version / download-url(内置更新器不校验 SHA-256,清单不带 sha256),
  # 再对每个上传的 asset(含 update.json)算 sha256 生成 SHA256SUMS.txt
  # (sha256sum 格式,供用户在下载页手动核对),两者作为 Release asset 发布并写进 job summary。
  # 客户端读的是 main 分支根目录的 update.json(手工维护),本 job 不自动推 main:
  # 发版后把 Release 里的 update.json 提交到仓库根即可(README「发布与更新流程」)。
  release-manifest:
    if: github.event_name == 'push'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: update_json_release 自测
        shell: bash
        run: python3 unit_test/ci/update-json-release/test_update_json_release.py

      - name: 下载 Release 产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p rel
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir rel \
            --pattern "BPLC_STA_Monitor_Setup_v${V}.exe" \
            --pattern "BPLC_STA_Monitor_v${V}_win64_symbols.tar.gz" \
            --pattern "BPLC_STA_Monitor_v${V}_linux_x86_64.tar.gz" \
            --pattern "BPLC_STA_Monitor_v${V}_linux_x86_64_symbols.tar.gz"
          ls -la rel

      - name: 生成 update.json
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          python3 scripts/update_json_release.py \
            --manifest update.json --out rel/update.json \
            --version "$V" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            "windows=rel/BPLC_STA_Monitor_Setup_v${V}.exe" \
            "linux=rel/BPLC_STA_Monitor_v${V}_linux_x86_64.tar.gz"

      - name: 生成 SHA256SUMS.txt(覆盖全部上传 asset)
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd rel
          sha256sum \
            "BPLC_STA_Monitor_Setup_v${V}.exe" \
            "BPLC_STA_Monitor_v${V}_win64_symbols.tar.gz" \
            "BPLC_STA_Monitor_v${V}_linux_x86_64.tar.gz" \
            "BPLC_STA_Monitor_v${V}_linux_x86_64_symbols.tar.gz" \
            update.json > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          {
            echo "### update.json(提交到仓库根)"
            echo '```json'
            cat update.json
            echo '```'
            echo "### SHA256SUMS.txt"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 传 update.json + SHA256SUMS.txt 到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            rel/update.json rel/SHA256SUMS.txt

      - name: 上传 update.json 产物
        uses: actions/upload-artifact@v6
        with:
          name: update-manifest
          path: |
            rel/update.json
            rel/SHA256SUMS.txt

  app-config-matrix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 安装 Qt 6.11.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          modules: 'qtserialport'
          cache: true

      - name: 安装构建依赖
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev zlib1g-dev

      - name: 构建 crash 依赖(sentry + crashpad)
        shell: bash
        run: bash 3rdparty/build_crash_deps.sh all

      - name: App 编译组合矩阵(default/sentry-only/both/none)
        shell: bash
        run: bash src/crash/tests/run_app_config_matrix.sh
