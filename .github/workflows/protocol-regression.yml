name: Protocol Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'unit_test/**'
      - 'tools/**'
      - 'samples/**'
      - 'wireshark_support_plugins/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt 6.11.3 and build dependencies
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          modules: 'qtserialport'
          cache: true

      - name: Hard-only source convention checks
        run: |
          python3 tools/check_i18n.py --strict
          python3 tools/check_title_case.py
          python3 - <<'PY'
          from pathlib import Path
          import sys

          guards = {}
          for header in Path("src").rglob("*.h"):
              guard = None
              for line in header.read_text(encoding="utf-8", errors="ignore").splitlines():
                  if line.startswith("#ifndef "):
                      guard = line.split(maxsplit=1)[1]
                      break
              if guard:
                  guards.setdefault(guard, []).append(str(header))
          duplicates = {guard: paths for guard, paths in guards.items() if len(paths) > 1}
          if duplicates:
              for guard, paths in sorted(duplicates.items()):
                  print(f"duplicate include guard {guard}:")
                  for path in paths:
                      print(f"  {path}")
              sys.exit(1)
          print(f"include guard uniqueness: PASS ({len(guards)} guards)")
          PY

      - name: Non-blocking full i18n/title-case report
        if: always()
        continue-on-error: true
        run: |
          python3 tools/check_i18n.py --strict || true
          python3 tools/check_title_case.py --strict || true

      - name: NW MSDU Debug regression (ASan/UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          mkdir -p build/nw-debug
          cd build/nw-debug
          qmake ../../unit_test/ci/nw-mme-test/nw_mme_test.pro CONFIG+=debug CONFIG-=release SANITIZERS=address,undefined 'QMAKE_CXXFLAGS+=-Wall -Wextra -Werror'
          make -j2
          ./nw_mme_test

      - name: NW MSDU Release regression
        run: |
          mkdir -p build/nw-release
          cd build/nw-release
          qmake ../../unit_test/ci/nw-mme-test/nw_mme_test.pro CONFIG+=release CONFIG-=debug 'QMAKE_CXXFLAGS+=-Wall -Wextra -Werror'
          make -j2
          ./nw_mme_test

      - name: Lossless bin/hex replay and export regression
        run: |
          mkdir -p build/roundtrip
          cd build/roundtrip
          qmake ../../unit_test/ci/roundtrip/roundtrip.pro CONFIG+=release CONFIG-=debug
          make -j2
          ./roundtrip "$GITHUB_WORKSPACE/unit_test/ci/roundtrip/roundtrip_test.bin" "$GITHUB_WORKSPACE/unit_test/ci/roundtrip/roundtrip_test.txt"

      - name: NW2026 OFDMA type1 regression
        run: |
          python3 wireshark_support_plugins/build_nw2026_ul_ofdma.py
          cd unit_test/ci/nw2026-type1-test
          mkdir -p build/type1
          cd build/type1
          qmake ../../nw2026_type1_test.pro CONFIG+=release CONFIG-=debug 'QMAKE_CXXFLAGS+=-Wall -Wextra -Werror'
          make -j2
          cd "$GITHUB_WORKSPACE"
          ./unit_test/ci/nw2026-type1-test/build/type1/nw2026_type1_test

      - name: PB reassembly / multi-station pairing / TEI-MAC regression probes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          QT_ROOT="$RUNNER_TEMP/qt-root"
          mkdir -p "$QT_ROOT"
          # qmake -query 任一键返回空/不存在时直接报明确错误,
          # 否则下面会抛 "failed to create symbolic link" 这种难懂的错误。
          for key in QT_HOST_BINS QT_INSTALL_LIBEXECS QT_INSTALL_HEADERS QT_INSTALL_LIBS QT_INSTALL_PLUGINS; do
            value=$(qmake -query "$key" || true)
            if [ -z "$value" ] || [ ! -d "$value" ]; then
              echo "::error::qmake -query $key 返回空或目录不存在: '$value'"
              exit 1
            fi
            echo "$key=$value"
          done
          ln -s "$(qmake -query QT_HOST_BINS)" "$QT_ROOT/bin"
          ln -s "$(qmake -query QT_INSTALL_LIBEXECS)" "$QT_ROOT/libexec"
          ln -s "$(qmake -query QT_INSTALL_HEADERS)" "$QT_ROOT/include"
          ln -s "$(qmake -query QT_INSTALL_LIBS)" "$QT_ROOT/lib"
          ln -s "$(qmake -query QT_INSTALL_PLUGINS)" "$QT_ROOT/plugins"
          export QT_ROOT
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          (cd unit_test/protocol-common/pb-reorder-probe && bash build.sh)
          (cd unit_test/protocol-common/pb-batch2-probe && bash build.sh)
          (cd unit_test/filter/info-crc-probe && bash build.sh)
          (cd unit_test/filter/orig-src-probe && bash build.sh)
          (cd unit_test/filter/mac-filter-probe && bash build.sh)

          unit_test/protocol-common/pb-reorder-probe/build/pb_reorder_probe/pb_reorder_probe
          unit_test/protocol-common/pb-batch2-probe/build/pb_batch2_probe/pb_batch2_probe
          unit_test/filter/info-crc-probe/build/info_crc_probe
          unit_test/filter/orig-src-probe/build/orig_src_probe \
            "$GITHUB_WORKSPACE/unit_test/protocol-gw/gw-topo-merge-probe/gw_topo_merge.bin"
          unit_test/filter/mac-filter-probe/build/mac_filter_probe

      - name: NW DL/UL OFDMA + truncated PB CRC24 regression probes
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          # Qt symlink farm:上一步建过就复用(同一 runner 同一 workspace),
          # 没建过(单独重跑本步)就按 qmake -query 重建一次。
          QT_ROOT="$RUNNER_TEMP/qt-root"
          mkdir -p "$QT_ROOT"
          [ -e "$QT_ROOT/bin" ]     || ln -s "$(qmake -query QT_HOST_BINS)"        "$QT_ROOT/bin"
          [ -e "$QT_ROOT/libexec" ] || ln -s "$(qmake -query QT_INSTALL_LIBEXECS)" "$QT_ROOT/libexec"
          [ -e "$QT_ROOT/include" ] || ln -s "$(qmake -query QT_INSTALL_HEADERS)"  "$QT_ROOT/include"
          [ -e "$QT_ROOT/lib" ]     || ln -s "$(qmake -query QT_INSTALL_LIBS)"     "$QT_ROOT/lib"
          [ -e "$QT_ROOT/plugins" ] || ln -s "$(qmake -query QT_INSTALL_PLUGINS)"  "$QT_ROOT/plugins"
          export QT_ROOT
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          for d in nw-dlofdma-crc-probe nw-trunc-pbcrc-probe nw-ul-crc-probe; do
            (cd "unit_test/protocol-nw/$d" && bash build.sh)
          done

          # 产物路径随平台不同:Windows(Qt 默认 debug_and_release)在 release/ 子目录,
          # Linux 单配置直接落在 build/<name>/ 下 ⇒ 逐个试,取第一个可执行的
          run_probe() {
            name="$1"; bin="$2"
            B="unit_test/protocol-nw/$name/build/$bin/release/$bin"
            [ -x "$B" ] || B="unit_test/protocol-nw/$name/build/$bin/$bin"
            if [ ! -x "$B" ]; then
              echo "::error::$name 未找到可执行文件(检查 build.sh 产物路径)"
              find "unit_test/protocol-nw/$name/build" -maxdepth 3 -type f | head -20
              exit 1
            fi
            "$B"
          }
          run_probe nw-dlofdma-crc-probe  nw_dlofdma_crc_probe
          run_probe nw-trunc-pbcrc-probe  nw_trunc_pbcrc_probe
          run_probe nw-ul-crc-probe       nw_ul_crc_probe

      - name: GW TEI-MAC learning regression (CRC32-gated learning, gw-learn-probe)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          # 与 OFDMA 那步共用 Qt symlink farm(单独重跑本步时按 qmake -query 重建)
          QT_ROOT="$RUNNER_TEMP/qt-root"
          mkdir -p "$QT_ROOT"
          [ -e "$QT_ROOT/bin" ]     || ln -s "$(qmake -query QT_HOST_BINS)"        "$QT_ROOT/bin"
          [ -e "$QT_ROOT/libexec" ] || ln -s "$(qmake -query QT_INSTALL_LIBEXECS)" "$QT_ROOT/libexec"
          [ -e "$QT_ROOT/include" ] || ln -s "$(qmake -query QT_INSTALL_HEADERS)"  "$QT_ROOT/include"
          [ -e "$QT_ROOT/lib" ]     || ln -s "$(qmake -query QT_INSTALL_LIBS)"     "$QT_ROOT/lib"
          [ -e "$QT_ROOT/plugins" ] || ln -s "$(qmake -query QT_INSTALL_PLUGINS)"  "$QT_ROOT/plugins"
          export QT_ROOT
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          cd unit_test/protocol-gw/gw-learn-probe
          bash build_probe.sh
          B=build/gw_learn_probe
          [ -x "$B" ] || B=build/gw_learn_probe.exe
          if [ ! -x "$B" ]; then
            echo "::error::gw-learn-probe 未找到可执行文件(检查 build_probe.sh 产物路径)"
            find build -maxdepth 2 -type f | head -20
            exit 1
          fi
          "$B" crafted.bin build/learn_report.txt
          cat build/learn_report.txt

          # 期望值取 README 写死的数(不反推)。核心回归:fixture 必须写 MSDU 帧尾 CRC32,
          # 否则 msdu_crc_allows_learning() 判坏载荷 ⇒ 摘要清空、TEI<->MAC 全学不到。
          # 修复前实测 total=6 accepted=6 msdu_pairs=1 ... gather=0 assoc_cnf=0。
          fail=0
          expect() {
            if grep -qF "$1" build/learn_report.txt; then
              echo "  ok: $1"
            else
              echo "::error::缺少期望输出: $1"
              fail=1
            fi
          }
          expect "total=15 accepted=15 msdu_pairs=16"
          expect "ofdma_tda_stations=4 gather=1 assoc_cnf=5 discover=5"
          # README 里说的"洞":短 MSDU 头的 AssocCnf 也必须学到站点 5
          if grep -F "FRAME 2 " build/learn_report.txt | grep -qF "pairs=[5:aa:bb:cc:dd:ee:05]"; then
            echo "  ok: FRAME 2 pairs=[5:..05] 短头 AssocCnf 的洞已补"
          else
            echo "::error::FRAME 2 未学到 5:aa:bb:cc:dd:ee:05(短头 AssocCnf 学习回退)"
            fail=1
          fi
          # MSDU CRC 覆盖 PB CRC:坏 PB CRC 但 MSDU CRC 有效 ⇒ 仍学(FRAME 7);
          # 单跳简头 ICV 三态(用户 2026-11 裁决:简头也要验证 ICV):
          # FRAME 8/9 = 正确 ICV ⇒ Ok 仍学;FRAME 14/15 = 篡改 ICV ⇒ Fail(摘要清空、不学)。
          if grep -F "FRAME 7 " build/learn_report.txt | grep -qF "pairs=[5:aa:bb:cc:dd:ee:05]" \
             && grep -F "FRAME 7 " build/learn_report.txt | grep -qF "topo=AssocCnf"; then
            echo "  ok: FRAME 7 坏 PB CRC 但 MSDU CRC 有效仍学"
          else
            echo "::error::FRAME 7 未学到 5:aa:bb:cc:dd:ee:05(MSDU CRC 覆盖失效)"
            fail=1
          fi
          if grep -F "FRAME 8 " build/learn_report.txt | grep -qF "pairs=[9:aa:bb:cc:dd:ee:09]"; then
            echo "  ok: FRAME 8 单跳 ICV 有效 + 坏 PB CRC 仍学"
          else
            echo "::error::FRAME 8 未学到 9:..09(单跳 ICV 有效应学)"
            fail=1
          fi
          if grep -F "FRAME 9 " build/learn_report.txt | grep -qF "pairs=[9:aa:bb:cc:dd:ee:09]"; then
            echo "  ok: FRAME 9 单跳 ICV 有效照常学"
          else
            echo "::error::FRAME 9 未学到 9:aa:bb:cc:dd:ee:09(单跳 ICV 有效应学)"
            fail=1
          fi
          if grep -F "FRAME 14 " build/learn_report.txt | grep -qF "sum=[] pairs=[-]"; then
            echo "  ok: FRAME 14 单跳 ICV 篡改 ⇒ 摘要清空不学"
          else
            echo "::error::FRAME 14 学到了(应 ICV 篡改 ⇒ Fail 不学)"
            fail=1
          fi
          if grep -F "FRAME 15 " build/learn_report.txt | grep -qF "sum=[] pairs=[-]"; then
            echo "  ok: FRAME 15 单跳 ICV 篡改 ⇒ 摘要清空不学"
          else
            echo "::error::FRAME 15 学到了(应 ICV 篡改 ⇒ Fail 不学)"
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1

      - name: GW single-hop 4B-header ICV regression (gw-icv-probe)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          QT_ROOT="$RUNNER_TEMP/qt-root"
          mkdir -p "$QT_ROOT"
          [ -e "$QT_ROOT/bin" ]     || ln -s "$(qmake -query QT_HOST_BINS)"        "$QT_ROOT/bin"
          [ -e "$QT_ROOT/libexec" ] || ln -s "$(qmake -query QT_INSTALL_LIBEXECS)" "$QT_ROOT/libexec"
          [ -e "$QT_ROOT/include" ] || ln -s "$(qmake -query QT_INSTALL_HEADERS)"  "$QT_ROOT/include"
          [ -e "$QT_ROOT/lib" ]     || ln -s "$(qmake -query QT_INSTALL_LIBS)"     "$QT_ROOT/lib"
          [ -e "$QT_ROOT/plugins" ] || ln -s "$(qmake -query QT_INSTALL_PLUGINS)"  "$QT_ROOT/plugins"
          export QT_ROOT
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          # 直接测 MSDU 解析器(不经过 SOF/PB 整链路):4B 单跳简头 + 标准 16B 头 ×
          # Ok/Fail/N-A 三态,表驱动跑 gw_2026/gw_2022。探针有 FAIL 即 exit 1。
          cd unit_test/protocol-gw/gw-icv-probe
          bash build.sh
          ./build/gw_icv_probe

      - name: GW/NW beacon load CRC32 regression (gw-beacon-crc-probe)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          QT_ROOT="$RUNNER_TEMP/qt-root"
          mkdir -p "$QT_ROOT"
          [ -e "$QT_ROOT/bin" ]     || ln -s "$(qmake -query QT_HOST_BINS)"        "$QT_ROOT/bin"
          [ -e "$QT_ROOT/libexec" ] || ln -s "$(qmake -query QT_INSTALL_LIBEXECS)" "$QT_ROOT/libexec"
          [ -e "$QT_ROOT/include" ] || ln -s "$(qmake -query QT_INSTALL_HEADERS)"  "$QT_ROOT/include"
          [ -e "$QT_ROOT/lib" ]     || ln -s "$(qmake -query QT_INSTALL_LIBS)"     "$QT_ROOT/lib"
          [ -e "$QT_ROOT/plugins" ] || ln -s "$(qmake -query QT_INSTALL_PLUGINS)"  "$QT_ROOT/plugins"
          export QT_ROOT
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          # 信标载荷 CRC32(BPCS)与 PB CRC24 三态:GW 走完整解析器,NW 直测
          # parse_beacon;载荷 CRC 失败标红不学,PB CRC 坏只标红仍学。探针有 FAIL 即 exit 1。
          cd unit_test/protocol-gw/gw-beacon-crc-probe
          bash build.sh
          ./build/gw_beacon_crc_probe

      - name: H1 get_bits bounds-check regression (h1-getbits-probe)
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
        run: |
          set -e
          # 与 gw-learn 那步共用 Qt symlink farm(单独重跑本步时按 qmake -query 重建)
          QT_ROOT="$RUNNER_TEMP/qt-root"
          mkdir -p "$QT_ROOT"
          [ -e "$QT_ROOT/bin" ]     || ln -s "$(qmake -query QT_HOST_BINS)"        "$QT_ROOT/bin"
          [ -e "$QT_ROOT/libexec" ] || ln -s "$(qmake -query QT_INSTALL_LIBEXECS)" "$QT_ROOT/libexec"
          [ -e "$QT_ROOT/include" ] || ln -s "$(qmake -query QT_INSTALL_HEADERS)"  "$QT_ROOT/include"
          [ -e "$QT_ROOT/lib" ]     || ln -s "$(qmake -query QT_INSTALL_LIBS)"     "$QT_ROOT/lib"
          [ -e "$QT_ROOT/plugins" ] || ln -s "$(qmake -query QT_INSTALL_PLUGINS)"  "$QT_ROOT/plugins"
          export QT_ROOT
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          # build.sh 默认构建并运行(ASan,79 用例);探针有 FAIL 即 exit 1,本步随之变红
          (cd unit_test/protocol-gw/h1-getbits-probe && bash build.sh)

      - name: Topology anomaly / identity-conflict regression (MAC↔TEI, restart-count)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          # Qt symlink farm:上一步建过就复用(同一 runner 同一 workspace),
          # 没建过(单独重跑本步)就在这里按 qmake -query 重建一次。
          QT_ROOT="$RUNNER_TEMP/qt-root"
          mkdir -p "$QT_ROOT"
          for key in QT_HOST_BINS QT_INSTALL_LIBEXECS QT_INSTALL_HEADERS QT_INSTALL_LIBS QT_INSTALL_PLUGINS; do
            value=$(qmake -query "$key" || true)
            if [ -z "$value" ] || [ ! -d "$value" ]; then
              echo "::error::qmake -query $key 返回空或目录不存在: '$value'"
              exit 1
            fi
            echo "$key=$value"
          done
          # 逐条建链接:上一步(或本步重跑)已建过就跳过,避免 ln 报 File exists 把步骤搞红,
          # 也避免"只看 include/QtCore 是否存在"在部分残留时误判为全覆盖。
          [ -e "$QT_ROOT/bin" ]     || ln -s "$(qmake -query QT_HOST_BINS)"        "$QT_ROOT/bin"
          [ -e "$QT_ROOT/libexec" ] || ln -s "$(qmake -query QT_INSTALL_LIBEXECS)" "$QT_ROOT/libexec"
          [ -e "$QT_ROOT/include" ] || ln -s "$(qmake -query QT_INSTALL_HEADERS)"  "$QT_ROOT/include"
          [ -e "$QT_ROOT/lib" ]     || ln -s "$(qmake -query QT_INSTALL_LIBS)"     "$QT_ROOT/lib"
          [ -e "$QT_ROOT/plugins" ] || ln -s "$(qmake -query QT_INSTALL_PLUGINS)" "$QT_ROOT/plugins"
          export QT_ROOT
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          (cd unit_test/topo/topo-restart-probe && bash build.sh)

          # 已编译的探针全部执行(成本≈0,不做"编了却不跑"):
          # A 同一 MAC 多 TEI / B 同一 TEI 多 MAC / C 重启次数往返振荡 / D 两链路计数不同
          # diversity_probe:期望矩阵按 gw_2026_pb_num_table(用户 2026-11 核对确认,权威)逐格抄写
          cd unit_test/topo/topo-restart-probe/build
          for p in cpc37_probe cpc_auth_probe dual_probe m2_probe m2m7_probe \
                   m6beacon_probe main_probe module_probe pb0_gate_probe model_probe \
                   anomaly_probe diversity_probe; do
            echo "== $p =="
            "./$p"
          done

      - name: Topo PCO / online-count / NID / route-sample regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          # 复用/重建 Qt symlink farm(逐条守卫,已存在则跳过)
          QT_ROOT="$RUNNER_TEMP/qt-root"
          mkdir -p "$QT_ROOT"
          [ -e "$QT_ROOT/bin" ]     || ln -s "$(qmake -query QT_HOST_BINS)"        "$QT_ROOT/bin"
          [ -e "$QT_ROOT/libexec" ] || ln -s "$(qmake -query QT_INSTALL_LIBEXECS)" "$QT_ROOT/libexec"
          [ -e "$QT_ROOT/include" ] || ln -s "$(qmake -query QT_INSTALL_HEADERS)"  "$QT_ROOT/include"
          [ -e "$QT_ROOT/lib" ]     || ln -s "$(qmake -query QT_INSTALL_LIBS)"     "$QT_ROOT/lib"
          [ -e "$QT_ROOT/plugins" ] || ln -s "$(qmake -query QT_INSTALL_PLUGINS)" "$QT_ROOT/plugins"
          export QT_ROOT
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          (cd unit_test/topo/topo-online-count-probe && bash build.sh)
          unit_test/topo/topo-online-count-probe/build/online_count_probe

          (cd unit_test/topo/topo-pco-probe && bash build.sh)
          unit_test/topo/topo-pco-probe/build/pco_probe

          (cd unit_test/topo/topo-nid-probe && bash build.sh)
          unit_test/topo/topo-nid-probe/build/probe/nid_probe

          # route-verify:主数据集 mpdus.bin 未入库,CI 只跑已入库的两个小样例
          (cd unit_test/topo/topo-route-verify && bash build.sh)
          (cd unit_test/topo/topo-route-verify && ./build/probe/topo_scan user_frame_container.bin)
          (cd unit_test/topo/topo-route-verify && ./build/probe/topo_scan user_frame_mpdu.bin)

      - name: NW APP business ID / direction regression (SPLC 表9 / 表8)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          # 复用/重建 Qt symlink farm(逐条守卫,已存在则跳过)
          QT_ROOT="$RUNNER_TEMP/qt-root"
          mkdir -p "$QT_ROOT"
          [ -e "$QT_ROOT/bin" ]     || ln -s "$(qmake -query QT_HOST_BINS)"        "$QT_ROOT/bin"
          [ -e "$QT_ROOT/libexec" ] || ln -s "$(qmake -query QT_INSTALL_LIBEXECS)" "$QT_ROOT/libexec"
          [ -e "$QT_ROOT/include" ] || ln -s "$(qmake -query QT_INSTALL_HEADERS)"  "$QT_ROOT/include"
          [ -e "$QT_ROOT/lib" ]     || ln -s "$(qmake -query QT_INSTALL_LIBS)"     "$QT_ROOT/lib"
          [ -e "$QT_ROOT/plugins" ] || ln -s "$(qmake -query QT_INSTALL_PLUGINS)" "$QT_ROOT/plugins"
          export QT_ROOT
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          (cd unit_test/protocol-nw/nw-app-bid-probe && bash build.sh)
          # 表9 四组合 + 端口不匹配的保留组合 + 表8 方向箭头 + 载荷不拆解;nw_2026/nw_2021 各一遍
          # 产物路径随平台不同:Windows(Qt 默认 debug_and_release)在 release/ 子目录,
          # Linux 单配置直接落在 build/<name>/ 下 ⇒ 逐个试,取第一个可执行的
          BIN=unit_test/protocol-nw/nw-app-bid-probe/build/nw_app_bid_probe/release/nw_app_bid_probe
          [ -x "$BIN" ] || BIN=unit_test/protocol-nw/nw-app-bid-probe/build/nw_app_bid_probe/nw_app_bid_probe
          if [ ! -x "$BIN" ]; then
            echo "::error::未找到 nw_app_bid_probe 可执行文件(检查 build.sh 产物路径)"
            find unit_test/protocol-nw/nw-app-bid-probe/build -maxdepth 3 -type f | head -20
            exit 1
          fi
          "$BIN"

          # MSDU CRC32 三态门控 + 反转义宽松(方案 A,用户 2026-11)W1-W6:
          # 防止把 0x3D 反转义改回严格后无人察觉(门禁兜底)
          (cd unit_test/protocol-nw/msdu-crc-gate-probe && bash build.sh)
          ./unit_test/protocol-nw/msdu-crc-gate-probe/build/msdu_crc_gate_probe

          # PB 块 CRC 失败口径(用户 2026-11):NW/GW 四个解析器 FC OK ⇒ 解析 + 红;
          # MSDU CRC32 OK ⇒ MSDU 照常解析;MSDU CRC32 FAIL ⇒ 不解析/不学习
          (cd unit_test/filter/pb-crc-red-probe && bash build.sh)
          ./unit_test/filter/pb-crc-red-probe/build/pb_crc_red_probe

      - name: Plugin backend / script sandbox / block format regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          # 进程内 Lua/JS/native 后端 + 示例插件(src/plugin/tests)
          mkdir -p build/backend-direct
          (cd build/backend-direct \
            && qmake ../../src/plugin/tests/backend_direct_test.pro CONFIG+=release CONFIG-=debug \
            && make -j2 \
            && ./backend_direct_test --examples "$GITHUB_WORKSPACE/src/plugin/examples")
          # M10:Lua 指令预算 / JS 看门狗打断死循环
          mkdir -p build/script-budget
          (cd build/script-budget \
            && qmake ../../unit_test/plugin/script-budget-probe/script_budget_probe.pro \
            && make -j2 && ./script_budget_probe)
          # 插件入口 canonical 包含检查
          mkdir -p build/entry-containment
          (cd build/entry-containment \
            && qmake ../../unit_test/plugin/entry-containment-probe/entry_containment_probe.pro \
            && make -j2 && ./entry_containment_probe)
          # L8:盘块反序列化计数/深度/截断边界
          mkdir -p build/serialize-bounds
          (cd build/serialize-bounds \
            && qmake ../../unit_test/common/serialize-bounds-probe/serialize_bounds_probe.pro \
            && make -j2 && ./serialize_bounds_probe)

      - name: Plugin market / plugin IPC (host process) regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          # 插件市场后端:feed 解析/版本/解包/安装/启停/卸载(夹具自生成,不依赖外部仓库)
          mkdir -p build/market-test
          (cd build/market-test \
            && qmake ../../src/plugin/tests/market_test.pro CONFIG+=release CONFIG-=debug \
            && make -j2 \
            && timeout 120 ./market_test)
          # 插件宿主进程 + IPC 帧协议:js_topo / lua_diag / lua_report 握手、解析、渲染、事件
          mkdir -p build/plugin-host build/plugin-ipc-test
          (cd build/plugin-host \
            && qmake ../../src/plugin/host/bplc-plugin-host.pro CONFIG+=release CONFIG-=debug \
            && make -j2)
          (cd build/plugin-ipc-test \
            && qmake ../../src/plugin/tests/plugin_ipc_test.pro CONFIG+=release CONFIG-=debug \
            && make -j2 \
            && timeout 150 ./plugin_ipc_test --host "$GITHUB_WORKSPACE/build/plugin-host/bplc-plugin-host" \
                 --examples "$GITHUB_WORKSPACE/src/plugin/examples")

  topology-worker-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Qt 6.11.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          cache: true
      - name: Build and run topology worker probe
        run: |
          set -e
          mkdir -p build/topo-worker-probe
          cd build/topo-worker-probe
          qmake ../../unit_test/topo/topo-worker-probe/topo_worker_probe.pro CONFIG+=release CONFIG-=debug
          make -j2
          ./topo_worker_probe

  topology-worker-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Qt 6.11.3 + MinGW 13.1.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: Build and run topology worker probe
        shell: bash
        run: |
          set -e
          mkdir -p build/topo-worker-probe
          cd build/topo-worker-probe
          qmake ../../unit_test/topo/topo-worker-probe/topo_worker_probe.pro CONFIG+=release CONFIG-=debug
          mingw32-make -j2
          if [ -x release/topo_worker_probe.exe ]; then
            ./release/topo_worker_probe.exe
          elif [ -x topo_worker_probe.exe ]; then
            ./topo_worker_probe.exe
          else
            echo "::error::topo_worker_probe.exe was not produced"
            find . -maxdepth 3 -type f | head -30
            exit 1
          fi
